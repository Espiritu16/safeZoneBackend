spring.application.name=SafeZone-Backend

# Render inyecta PORT automaticamente; en local usa 8080 si no existe.
server.port=${PORT:8080}

#swagger para tener la documentacion de los endpoints, get,post y esas cosas
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# mysql datasource
spring.datasource.url=${MYSQL_DB_URL:jdbc:mysql://localhost:3306/safezonedb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${MYSQL_DB_USERNAME:root}
spring.datasource.password=${MYSQL_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# flyway para que el asistente pueda consultar toda la estructura de la bd sin necesidad de estar exportandolo, 
# y para eso leera las variables de entorno de las credenciales de la BD
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true

# correo para recuperacion de contrasena
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# app auth
app.correo.modo-simulacion=${APP_CORREO_MODO_SIMULACION:true}
app.correo.remitente=${APP_CORREO_REMITENTE:no-reply@safezone.local}

# jwt / sesion
app.jwt.secreto=${APP_JWT_SECRETO:VW5hQ2xhdmVTZWNyZXRhU2FmZVpvbmVDb25BTFRPUmllc2dvXzIwMjY=}
app.jwt.expiracion-minutos=${APP_JWT_EXPIRACION_MINUTOS:30}
app.auth.refresh-expiracion-dias=${APP_AUTH_REFRESH_EXPIRACION_DIAS:7}
